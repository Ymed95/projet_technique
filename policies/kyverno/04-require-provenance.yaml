# Politique 4 — Exiger une ATTESTATION DE PROVENANCE (SLSA) valide.
# Signer ne suffit pas : on exige la preuve "d'où vient cette image" (qui/quoi/quand).
# Kyverno vérifie l'attestation de type slsaprovenance attachée à l'image.
#
# BONUS (commenté) : on peut aussi vérifier des CONDITIONS sur le contenu de la provenance,
# p.ex. que le build vient bien de la branche main de votre dépôt.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-provenance-attestation
  annotations:
    policies.kyverno.io/title: Exiger l'attestation de provenance
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/description: >-
      Refuse toute image sans attestation de provenance SLSA signée et valide.
spec:
  # NOTE (limite outil documentée) : Kyverno impose une limite CODÉE EN DUR de 2 Mo pour
  # charger une attestation dans son contexte de vérification (non configurable par flag).
  # Notre attestation SBOM réelle pèse 2,3 Mo (Syft catalogue 112 paquets + 2682 fichiers).
  # Kyverno charge les attestations co-localisées lors de la vérif provenance -> dépassement.
  # Choix assumé : on ENFORCE la signature (policy 03, keyless) et on garde la provenance en
  # AUDIT. La provenance reste ATTACHÉE et VÉRIFIABLE hors cluster (cosign verify-attestation
  # --type slsaprovenance réussit). Pour un enforcement complet : réduire le SBOM sous 2 Mo
  # (syft sans catalogage fichiers) puis relancer la CI.
  validationFailureAction: Audit
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verifier-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/ymed95/scs-demo-app*"
          required: true
          attestations:
            - type: https://slsa.dev/provenance/v0.2
              attestors:
                - count: 1
                  entries:
                    # MODE KEYLESS : la provenance doit être signée par NOTRE workflow (OIDC).
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subject: "https://github.com/Ymed95/projet_technique/.github/workflows/supply-chain.yml@refs/heads/main"
                        rekor:
                          url: "https://rekor.sigstore.dev"
              # ---- BONUS : conditions sur le CONTENU de la provenance ----
              # conditions:
              #   - all:
              #       - key: "{{ buildType }}"
              #         operator: Equals
              #         value: "https://example.com/manual-local-build/v1"
